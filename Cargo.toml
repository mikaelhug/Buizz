[workspace]
resolver = "3"
members = ["crates/*", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
buizz-core = { path = "crates/core" }
buizz-market = { path = "crates/market" }
buizz-state = { path = "crates/state" }
buizz-engine = { path = "crates/engine" }
buizz-metrics = { path = "crates/metrics" }
buizz-supervisor = { path = "crates/supervisor" }
buizz-sources = { path = "crates/sources" }
buizz-runner = { path = "crates/runner" }
buizz-feed = { path = "crates/feed" }
buizz-ingest = { path = "crates/ingest" }
buizz-api = { path = "crates/api" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "query"] }
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
duckdb = { version = "1.20000.1", features = ["bundled", "chrono"] }
futures = "0.3.34"
libm = "0.2.16"
nix = { version = "0.31.3", features = ["signal", "process"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query"] }
rmp-serde = "1.3.1"
roxmltree = "0.21.2"
rmpv = "1.3.1"
rusqlite = { version = "0.42.0", features = ["bundled", "chrono"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
subtle = "2.6.1"
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "decimal", "preserve_order"] }
utoipa-axum = "0.3.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
