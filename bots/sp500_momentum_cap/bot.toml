description = "Cap-weighted momentum in the S&P 500, after the S&P 500 Momentum index methodology (S&P Dow Jones Indices, S&P Momentum Indices Methodology): each point-in-time S&P 500 member with a market cap (last close times the latest XBRL shares outstanding visible at the clock, split-adjusted from its filing date; total shares, not S&P's float) and 13 month-ends of prices gets a risk-adjusted momentum value, its split-adjusted price change over the 12 months to the month-end before the rebalancing reference date (M-13 to M-1: the reference month is skipped), divided by the standard deviation of its daily price returns over the same 12 months, standardised to a z-score across members and winsorised at +-3. The top holdings by z are weighted by market cap times the momentum score (1 + z for z > 0, 1 / (1 - z) otherwise), each capped at the lower of max_weight and index_multiple times its S&P 500 cap weight, the excess spread over the uncapped names; what no name can absorb is held in cash (SPY, tradable outside the index). Rebalanced on the first step and then at the close of the third Friday of March and September (the session before when it is a holiday), the index's effective dates, with the last sessions of February and August as reference dates, so momentum runs from end-January to end-January (end-July for September) (rebalance = monthly instead rebalances at every month end, each its own reference date, skipping the month just ended). Selection follows the index's buffer: the top 80% of holdings by z are taken, then current holdings ranked within 120% of holdings in rank order, then the best of the rest until holdings names are chosen (buffer = 0 takes the top holdings); a drift band (drift_band of each target) spares small trades. weighting = equal holds 1/holdings each. Expected behaviour against total-return SPY: a 5-8% tracking error, ahead in persistent trends and behind at sharp reversals (2009, Nov 2020) when the up to six-month-old portfolio still holds last year's winners; the momentum premium among large caps is small (around 1-2%/yr before costs), so expect the result to be dominated by the sector tilts momentum takes. Sweep grid: rebalance = semiannual, monthly; holdings = 50, 100; weighting = cap_score, equal. Data: S&P 500 membership is reliable from 2011 and share counts come from XBRL (2009 on), so the first honest start is 2012-01; design 2012-2017, validation 2018-2025."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { index = "sp500" }
params = { holdings = 100, weighting = "cap_score", rebalance = "semiannual", max_weight = 0.09, index_multiple = 3.0, buffer = 0.2, drift_band = 0.25, cash = "SPY" }
benchmark = "SPY"
step_timeout = 300

[risk]
max_gross_exposure = 1.0
