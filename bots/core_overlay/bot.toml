description = "A cap-weighted S&P 500 selection core with a market-exposure overlay and modest leverage. The core is spy_ex_junk (core ex_junk: the point-in-time S&P 500 cap-weighted without its junkiest exclude fraction; Stambaugh, Yu & Yuan 2012, Asness, Frazzini & Pedersen 2019) or sp500_quality_momentum (core quality_momentum: the top holdings by gross profitability, 12-1 momentum and SUE, cap-weighted within index_multiple of their index weight; Novy-Marx 2013 and 2015, Jegadeesh & Titman 1993), built by the same code in buizz_bots as those bots and rebalanced on their schedules through the same drift band. Every day the overlay sets the market exposure: overlay breadth holds l_max while at least 50% of the point-in-time S&P 500 members are above their own 200-day SMA or SPY is above its own (Zweig 1986, Faber 2007), else 0; overlay votes holds l_max times the share of bullish trend, VIX term-structure, credit-spread and growth conditions (buizz_bots.signals; Faber 2007, Gilchrist & Zakrajsek 2012, Livermore 2016). The core stays fully invested and the exposure is set with the index instead, as a futures overlay would (portable alpha): SPY at exposure - 1 of equity on top of the core (short below 1, borrowed above 1 at the T-bill rate plus the financing spread, the short paying the borrow rate) and the exposure below 1 in T-bills (BIL), so a risk-off book keeps the core's selection spread over the index and no market beta, and the overlay never trades the hundreds of core names. The SPY and BIL legs are resized at the next open once either is more than band (0.10) of equity off its target. Sweep grid, fixed before any test: core ex_junk, quality_momentum x l_max 1.0, 1.25, 1.5 with overlay breadth; the same with overlay votes only if a breadth variant passes. Expected against total-return SPY: the core's small selection edge (0.5-2%/yr in the papers) plus the overlay's drawdown cut in 2018-Q4, 2020 and 2022, giving back in V-shaped rebounds the overlay sits out (early 2019, spring 2020); leverage lifts CAGR only when the combination's Sharpe ratio is above SPY's. The S&P 500 universe makes the run carry data warnings while member listings lack bars. Data: membership is reliable from 2011 and XBRL from 2009, so the first honest start is 2012-01."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { index = "sp500" }
params = { core = "ex_junk", overlay = "breadth", l_max = 1.0, market = "SPY", cash = "SPY", bills = "BIL", band = 0.10, exclude = 0.2, rebalance = "quarterly", holdings = 100, weighting = "cap", index_multiple = 3.0, drift_band = 0.25 }
benchmark = "SPY"
step_timeout = 300

[risk]
max_gross_exposure = 3.0
