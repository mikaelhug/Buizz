description = "Value and momentum market timing after Asness, Ilmanen and Maloney (2017, 'Market Timing: Sin a Little', Journal of Investment Management), their VM timing strategy on the S&P 500. At the first step and each month's last close, two signals are each turned into a tilt with the paper's scaling, (signal trimmed at its 5th and 95th percentiles minus its median) / (95th minus 5th percentile), capped at +-50%, over the signal's expanding monthly history: value is the S&P 500 forward earnings yield, 100 / FactSet's forward 12-month P/E of the last weekly Earnings Insight published before the clock, sampled at each month's last report since 2012 (the paper's Shiller E/P has no free point-in-time source; value = ep_minus_bond subtracts the 10-year Treasury yield known by the report's publication, the paper's 'Fed model' variant); momentum is SPY's 12-month total return minus 12 months of 3-month T-bill returns (FRED TB3MS), at each month end since 2001. A signal with fewer than min_history_years of history is neutral. SPY is held at 100% plus the mean of the two tilts, 50% to 150%; below 100% the rest is in T-bills (BIL), above it the rest is borrowed at the T-bill rate plus the cost model's financing spread, as the paper borrows or lends cash. Trades at the next open. The paper's history is 60 rolling years from 1881; here it starts in 2000 and 2012, so early tilts rest on short histories. Expected behaviour: the paper finds value timing alone no better than buy and hold after 1958, momentum timing and the combination modestly better (Sharpe 0.41 vs 0.37 in 1958-2015, gross), with a tracking error around 3%."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { symbols = ["SPY", "BIL"] }
params = { equity = "SPY", cash = "BIL", value = "ep", trim = 0.05, min_history_years = 3 }
benchmark = "SPY"

[risk]
max_gross_exposure = 1.6
