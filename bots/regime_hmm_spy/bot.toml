description = "Shu-Yu-Mulvey HMM baseline: daily 2-state hmmlearn refit on 3,000 SPY sessions, Bulla median filter, SPY or BIL"
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
