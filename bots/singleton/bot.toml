description = "Singleton v1: companies that shrink their share count by buying their own stock cheap, held for years in a concentrated book and sold only when the company stops behaving like Teledyne. Monthly, from 10-K XBRL and Form 4: shares outstanding (split-adjusted) down at least 4% a year over the last two fiscal years, with repurchases in both years and free cash flow covering at least 80% of them; the repurchase dollars spent at a dollar-weighted earnings yield (net income over the year's average market cap) at least the larger of that year's average 10-year Treasury yield and 1/15 ('I won't pay 15 times earnings', Forbes 1978); an earnings yield today above the same hurdle; no rise in the share count over the last year; no 8-K Item 4.02 restatement in five years; and no net open-market selling by officers and directors over 12 months (sales under a 10b5-1 plan left out once Form 4 has the box, April 2023). New names open at 5% of equity, best buyback yield times earnings yield first, at most 16 names; a held name that still qualifies gets a lumpy 5% add whenever it closes 20% or more below its average cost, up to 15%. Winners are never trimmed. A name is sold in full (tagged thesis:) when the company issues shares (count up 2% or more in a year), bought back at an earnings yield below the 10-year Treasury in its latest fiscal year, restates its accounts, or its officers and directors net-sell 1% of the company in 12 months; never on price. Fully in stocks while the S&P 500 forward earnings yield is at least the 10-year yield, else 70%; what the stock book leaves goes to BIL. Repurchase prices are each fiscal year's average, since 10-Q cash flows are year-to-date and the issuer-purchase tables and SC TO-I tenders are not in the store (BRIEF.md)."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { top_dollar_volume = 3000, asset_class = "stock" }
params = { bills = "BIL", min_shrink = 0.04, fcf_coverage = 0.8, max_pe = 15, max_names = 16, start = 0.05, add_step = 0.05, add_on_drop = 0.20, cap = 0.15, defensive_share = 0.7, exit_issuance = 0.02, exit_insider_selling = 0.01 }
