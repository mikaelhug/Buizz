description = "Equal-weight vote of eight market-timing conditions fixed in advance at their published parameters (buizz_bots.signals): trend (SPY total-return close above its 200-day SMA; Faber 2007), breadth (at least 50% of that day's point-in-time S&P 500 members above their own 200-day SMA), credit (monthly Baa-minus-10-year spread at or below its 6-month mean; Gilchrist & Zakrajsek 2012), vix (VIX/VIX3M at most 1, the previous session's closes), labour (unemployment at or below its 12-month mean, latest vintages; Livermore 2016), growth (at least half of three activity indicators expanding, each against its trend as in Livermore 2016, Growth-Trend Timing: the 4-week average of initial claims at or below its 52-week average, industrial production and retail sales deflated by CPI-U at or above their 12-month averages, latest vintages), curve (not both a negative 10y-3m curve within 24 months and a Sahm gap of 0.5 from the unrate vintages; Estrella & Mishkin 1998, Sahm 2019) and valuation (forward earnings yield minus the 10-year yield not in the bottom 20% of its expanding history, from 3 years of it; Asness, Ilmanen & Maloney 2017). After each close b = bullish votes / votes whose data is visible at the clock (curve from mid-2005, vix from 2009-09, valuation from about 2014). mapping linear holds SPY at l_max * b; majority holds l_max when b >= 0.6, 1.0 when b >= 0.4, else 0; the rest of equity up to 1 is in BIL and leverage above 1 is borrowed at the T-bill rate plus the financing spread. BIL listed on 2007-05-30, so before that the BIL share stays uninvested cash. Trades at the next open, only when a leg is more than band (0.10) of equity off its target. Sweep grid, fixed before any test: l_max 1.0, 1.25, 1.5 x mapping linear, majority; nothing in the combination is fitted. Expected against total-return SPY: at l_max 1.0 a lower CAGR in steady bull markets (average exposure below 1), a markedly smaller drawdown in 2008-type bear markets that the slow macro votes see, and lagging the V-shaped 2020 rebound; at 1.25-1.5 a CAGR near or above SPY's at a drawdown no worse than SPY's; majority trades less than linear. Design period 2003-2015, validation 2016 to 2025-10. The universe is the point-in-time index for breadth, so its runs carry no survivorship badge; SPY and BIL are tradable outside it."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { index = "sp500" }
params = { asset = "SPY", cash = "BIL", l_max = 1.0, mapping = "linear", band = 0.10 }

[risk]
max_gross_exposure = 1.5
