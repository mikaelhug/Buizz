description = "Point-in-time S&P 500 breadth regime: after each close, the share of that day's members (ctx.universe_at, delisted members included) above their own 200-day SMA, averaged over 10 sessions; hold SPY while it is at least 50%, below that only while SPY is above its own 200-day SMA, else BIL, trading at the next open"
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { symbols = ["SPY", "BIL"] }
params = { asset = "SPY", cash = "BIL", sma_days = 200, smoothing_days = 10, threshold = 0.5 }

[risk]
max_gross_exposure = 1.0
