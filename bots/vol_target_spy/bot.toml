description = "Moreira-Muir (2017) volatility-managed SPY: at each month's last close hold min(cap, target_vol² / RV) of SPY, where RV is the realized variance of the month just ended (the sum of squared deviations of its daily total returns from their mean, times 12), the rest in BIL, trading at the next open only when the SPY weight is off by more than the 10-point band. Scaling by the inverse variance, not the inverse volatility, is the mean-variance timing the paper derives: exposure falls hard after turbulent months and rises after calm ones. The paper's c is fixed in sample to match the market's volatility; here it is target_vol² (default 15%, about SPY's long-run volatility) fixed in advance, so nothing is fitted. cap = 1.5 borrows the excess at the T-bill rate plus the financing spread; the paper's unconstrained weights reach several times equity. Cederburg, O'Doherty, Wang & Yan (2020) find real-time versions of such strategies usually trail their benchmark, so this is a test of whether the market case holds."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { symbols = ["SPY", "BIL"] }
params = { asset = "SPY", cash = "BIL", target_vol = 0.15, cap = 1.0, band = 0.10 }

[risk]
max_gross_exposure = 1.5
