description = "Quality and momentum in the S&P 500, after Novy-Marx (2013, The other side of value: gross profitability), Jegadeesh & Titman (1993, 12-1 momentum) and Novy-Marx (2015, Fundamentally, momentum is fundamental: earnings momentum). At the first step and each month's last close, for point-in-time S&P 500 members outside financials (SIC 6000-6999, the one-digit SIC 6 Novy-Marx excludes, the company's current SIC from EDGAR applied to all years: a company that changed industry carries its current code back) with a market cap (last close times the latest XBRL shares outstanding visible at the clock, split-adjusted from its filing date), score three measures as rank z-scores and average them with equal weights: gross profit / total assets of the latest 10-K, 12-1 month total return, and SUE, the latest quarter's diluted EPS minus the same quarter a year earlier (seasonal random walk) over the standard deviation of those innovations in the last 8 quarters (at least 6), from 3-month diluted EPS as filed in 10-Qs (and the Q4 figures 10-Ks tag), each split-adjusted from its filing date and never derived from annual minus quarters; the latest quarter must have ended within 240 days. Members need all three. Hold the top holdings by the composite, cap-weighted with each name capped at index_multiple times its S&P 500 weight (all members, financials included); what the caps leave over is held in cash (SPY, tradable outside the index), so the book is SPY plus an overweight in quality-momentum names. weighting = equal holds 1/holdings each instead. Resized through a drift band: a leg trades only once it drifts more than drift_band of its target. Expected behaviour against total-return SPY: higher tracking error (4-7% a year) with a positive tilt to profitable winners with improving earnings; Novy-Marx finds profitability and earnings momentum each earn a premium in large caps, momentum crashes in sharp junk rebounds (2009, Nov 2020) are the main risk. Sweep grid: weighting = cap, equal; holdings = 50, 100. Data: S&P 500 membership is reliable from 2011, XBRL starts in 2009 and SUE needs 12 quarters, so the first honest start is 2012-01; design 2012-2017, validation 2018-2025."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { index = "sp500" }
params = { holdings = 100, weighting = "cap", index_multiple = 3.0, drift_band = 0.25, cash = "SPY" }
benchmark = "SPY"
step_timeout = 300

[risk]
max_gross_exposure = 1.0
