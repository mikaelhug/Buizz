description = "SDK demo: the profitable companies that shrank their share count most over their last fiscal year, rebalanced quarterly. Its closest live product, PKW, has matched SPY since 2007; Fama and French (2008) find large repurchasers earn +0.28% a month among big stocks before costs. singleton is the research-faithful buyback bot"
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { top_dollar_volume = 500, asset_class = "stock" }
params = { min_shrink = 0.03, holdings = 20, gross = 0.95 }

[risk]
max_position_weight = 0.1
