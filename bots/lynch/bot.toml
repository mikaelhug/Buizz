description = "Peter Lynch as One Up on Wall Street and Beating the Street describe him: each month every operating company with six consecutive 10-K years of diluted EPS (split-adjusted) is put in one of his six categories from its record: cyclical (revenue fell in at least two of five years, once by 10% or more), turnaround (a loss in one of the last two fiscal years), asset play (tangible book at least the market cap), else by the 5-year EPS CAGR a fast grower (20% or more), stalwart (10% to 20%) or slow grower (0% to 10%, dividends paid every year). It buys growers at a PEGY, (EPS growth + dividend yield) / P/E on trailing EPS, of at least 1.5, growth under 50%; cyclicals with trailing EPS rising from a year ago but at most half the record's peak; turnarounds once trailing EPS is positive again; asset plays at three quarters of tangible book or less. Every buy needs debt at most a third of equity (Lynch's 75/25 normal balance sheet) and no 8-K Item 4.02 restatement in five years; within a category, names with opportunistic insider buying in the last year (Cohen-Malloy-Pomorski) and net cash come first, and the categories take turns. Up to 100 names at 1% of equity each, 1 point more when one closes 20% below cost and still qualifies, up to 2%; BIL holds only what empty slots leave. Sells, each tagged: stalwarts and slow growers at +50%, or +30% with the P/E above its 6-year median (price:); fast growers when trailing EPS grows less than 10% a year (thesis:) and growers at a PEGY of 0.5 or less (valuation:); stalwarts when earnings shrink and slow growers on a dividend cut of 10% (thesis:); cyclicals at peak earnings with the P/E at or below its median (valuation:); turnarounds once the last two fiscal years are profitable (valuation:) or when trailing EPS turns negative again (thesis:); asset plays once the market cap reaches tangible book (valuation:); any name on a restatement or debt above equity (thesis:). The story, store visits and scuttlebutt are left out (BRIEF.md)."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { top_dollar_volume = 3000, asset_class = "stock" }
params = { max_names = 100, start = 0.01, add_step = 0.01, add_on_drop = 0.20, cap = 0.02, record_years = 6, fast_growth = 0.20, stalwart_growth = 0.10, max_growth = 0.50, min_pegy = 1.5, sell_pegy = 0.5, cyclical_falls = 2, cyclical_drop = 0.10, cyclical_trough = 0.5, turnaround_years = 2, asset_entry = 0.75, max_debt_equity = 0.33, break_debt_equity = 1.0, exit_gain = 0.50, stretched_gain = 0.30, dividend_cut = 0.10, insider_days = 365, routine_years = 3, restatement_years = 5, cash_symbol = "BIL" }
step_timeout = 1800

[risk]
max_gross_exposure = 1.0
