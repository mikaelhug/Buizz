description = "Leverage only in an uptrend (Gayed & Bilello 2016, Leverage for the Long Run): ten minutes before each close, with the session so far as today's close, hold SPY at l_max times equity while SPY's total-return close is above 1.01 x its trend average, else 100% BIL; the order goes to that session's closing auction. filter sma200 compares with the 200-session SMA every day; filter 10-month (Faber 2007) compares the month-end close with the average of the last 10 month-end closes on the month's last session only and keeps that decision until the next month end. With target_vol above 0 the SPY weight is min(l_max, target_vol / EWMA volatility of daily returns, 30-day half-life) instead of l_max (Moreira & Muir 2017); 0 means no volatility targeting. Leverage above 1 is borrowed at the T-bill rate plus the financing spread; the rest of equity up to 1 is in BIL. BIL listed on 2007-05-30, so before that the BIL share stays uninvested cash. Trades only when a leg is more than band (0.10) of equity off its target, and logs when the official close would have decided the trend otherwise. Sweep grid, fixed before any test: l_max 1.25, 1.5, 2.0 x filter sma200, 10-month x target_vol 0, 0.18; nothing in the combination is fitted. Expected against total-return SPY: a higher CAGR than SPY in long uptrends (2003-2007, 2010-2019), most of the 2008 decline avoided, giving back several points in whipsaw years (2011, 2015-2016, 2018) and around fast V-shaped crashes (2020), so a drawdown below SPY's but a volatility above it at l_max 2.0; target_vol 0.18 lowers exposure in turbulent uptrends. Design period 2003-2015, validation 2016 to 2025-10."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "before_close:10m"
universe = { symbols = ["SPY", "BIL"] }
params = { asset = "SPY", cash = "BIL", l_max = 1.25, filter = "sma200", target_vol = 0.0, buffer = 0.01, vol_half_life_days = 30, band = 0.10 }

[risk]
max_gross_exposure = 2.0
