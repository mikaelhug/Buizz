description = "Opportunistic insider purchase clusters in the point-in-time S&P 500, after Cohen, Malloy & Pomorski (2012), Decoding Inside Information. After each close it reads the SEC Form 4 open-market purchases (code P, acquired) of officers and directors visible so far; each filing is visible from the first session open after its EDGAR acceptance. Only opportunistic insiders count, classified as the paper does at the start of each calendar year from their open-market purchases and sales (P or S) in the same company in the 3 prior calendar years, judged on the filings visible at the clock: an insider needs at least one such trade in each of those years to be classified at all, is routine when one calendar month holds a trade in every one of them, and opportunistic otherwise. Routine trades carry no information in the paper, and insiders without three years of trading are outside its sample, so both are left out. A cluster is at least 2 distinct remaining insiders buying the same stock with trade dates in the last 30 calendar days for at least $100,000 in total; it signals on the session one of its filings becomes visible. Nothing is counted twice: a filing's value is the sum of its purchase lines (shares times price, lines without either left out), a joint filing counts once and each of its officer or director owners is one insider, and a 4/A replaces the latest earlier visible filing of the same owners that reports a trade on one of its dates, so an unchanged amendment counts once and a corrected one with its corrected figures; one that matches no such filing counts on its own. New clusters, largest value first, are bought at the next open at an equal 1/30 of equity each for at most 30 names (less when the held names have grown past their share, so the book never exceeds its equity), held 63 sessions without rebalancing and sold at the next open, also after the name has left the index; a new cluster in a held name does not extend it. The rest of the equity is parked in SPY, tradable outside the index, and resized only when a name enters or leaves. Form 4 XML history starts mid-2003 and is still being backfilled, so a run before the backfill reaches its start sees too few clusters."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { index = "sp500" }
params = { cash = "SPY", max_names = 30, hold_sessions = 63, window_days = 30, min_insiders = 2, min_value = 100000, routine_years = 3 }

[risk]
max_gross_exposure = 1.0
