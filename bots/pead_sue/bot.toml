description = "Post-earnings-announcement drift on standardised unexpected earnings, after Foster, Olsen and Shevlin (1984) and Bernard and Thomas (1989). Each earnings release (an 8-K with Item 2.02, from its EDGAR acceptance time; an 8-K/A counts only when it is the first filing for its event) of a stock among the 1000 with the highest dollar volume is scored once the quarter's diluted EPS is public: SUE is the seasonal random-walk innovation (EPS minus the same quarter a year earlier) over the standard deviation of the last 8 innovations (at least 6), from 3-month diluted EPS as filed in the 10-Q or 10-K, split-adjusted from each filing date, with a fourth quarter the 10-K does not tag taken as fiscal-year EPS minus the three quarters. Its decile breakpoints come from the SUEs of the releases announced in the 91 days before whose EPS was public before the current session and within entry_lag_sessions of their announcement, the trailing cross-section, so no breakpoint uses a later announcement; each release is decided once, on the first step its EPS is public, so a restarted run (a live run starts a new process every session) rebuilds the same breakpoints and decisions. A release in the top decile is bought and one in the bottom decile sold short at the next open, provided its EPS became public within entry_lag_sessions of the announcement (XBRL EPS arrives with the 10-Q or 10-K, the same or the next day for most 10-Qs and a median week later for 10-Ks; the announced EPS itself is not machine-readable before 2022), and each is closed hold_sessions after the announcement. Legs are equal-weighted at 1/names each, capped at max_weight, a dollar long and a dollar short in steady state, resized through a drift band. Shorts pay the cost model's flat borrow rate (no per-name borrow history). Expected behaviour: Bernard and Thomas find about 4% over 60 days for the extreme-decile spread in 1974-1986; later work (Chordia et al. 2009, Martineau 2022) finds the drift much smaller in large, liquid stocks after 2000 and close to zero recently, so expect a small spread that costs may eat."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { top_dollar_volume = 1000, asset_class = "stock" }
params = { hold_sessions = 60, decile = 0.1, entry_lag_sessions = 10, max_weight = 0.02, drift_band = 0.25 }
benchmark = "SPY"
step_timeout = 300

[risk]
max_gross_exposure = 2.2
