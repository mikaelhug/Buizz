description = "Integrated value, momentum, quality and low-risk long/short, industry-neutral, dollar-neutral and beta-hedged, after Fitzgibbons, Friedman, Pomorski and Serban (2017, 'Long-Only Style Investing: Don't Just Mix, Integrate'). At the first step and each month's last close, every stock among the 1000 with the highest dollar volume that has a market cap (last close times the latest 10-K or 10-Q share count, split-adjusted, one line per company) gets six measures: EBITDA/EV (operating income plus depreciation and amortisation of the latest 10-K over market cap plus total debt, short-term debt included, plus preferred stock minus cash; Loughran and Wellman 2011), book-to-market on the current market cap (Asness and Frazzini 2013), 12-1 month total return (Jegadeesh and Titman 1993), gross profit over total assets (Novy-Marx 2013), cash-flow accruals, minus net income less operating cash flow over average total assets (Sloan 1996 as measured by Hribar and Collins 2002), and minus the volatility of 156 weekly returns (Blitz and van Vliet 2007). Accounting inputs are annual, from the last two domestic 10-Ks, as in the sources. Each measure is a rank z-score within its Fama-French 49 industry (from the company's current EDGAR SIC code, carried back), industries with fewer than min_industry scored members pooled into one group (rank z-scores make the 1%/99% winsorising moot); a style is the mean of its measures and the composite the styles' fixed weights. The top quintile is held long and the bottom quintile short, a dollar each, equal-weighted (weighting = value: by market cap), and SPY hedges the book's beta, the weighted sum of each name's daily OLS beta over beta_days sessions (Novy-Marx and Velikov 2022). buffer keeps a held name until it leaves its quintile widened by buffer (Novy-Marx and Velikov 2016); construction = mix runs one quintile long/short per style at its style weight instead. Shorts pay the cost model's flat borrow rate; the universe is today's liquid stocks rather than CRSP or Russell. Expected behaviour: a low-beta, low-volatility spread whose Sharpe in the sources is around 1 gross; value and momentum sleeves correlate negatively; integration should beat mixing by holding fewer offsetting positions."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { top_dollar_volume = 1000, asset_class = "stock" }
params = { quantile = 0.2, styles = { value = 0.25, momentum = 0.25, quality = 0.25, low_risk = 0.25 }, construction = "integrate", weighting = "equal", hedge = "SPY", beta_days = 252, buffer = 0.0, min_industry = 5, drift_band = 0.25 }
benchmark = "SPY"
step_timeout = 600

[risk]
max_gross_exposure = 2.6
