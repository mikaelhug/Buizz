description = "Graham's general portfolio as Graham-Newman ran it, not a bare screen. Each month the stock share is set between 25% and 75% by the market temperature (buizz_bots.persona: forward P/E against its 10-year average, the Baa spread, VIX and the S&P 500 drawdown, each as a 10-year percentile), more in stocks the cheaper and more fearful the market, 50-50 while no gauge is visible. The stock book is filled in Graham's order of preference in slots of 1/30 of that share, so it holds 30 issues or more when enough qualify (1976 interview): net-nets below two-thirds of net current asset value first, then names passing his 1976 rule (earnings yield at least twice Moody's AAA, P/E at most 10, equity at least half of assets). Nothing forces a slot to be filled; the rest of equity sits in IEF, 7 to 10 year Treasuries (his bonds at a 7 to 8 year average maturity). A name is sold at +50% on cost (tagged price:), at the end of the second calendar year after purchase, or when its dividend is cut more than 10% below the median of its last four payments or omitted (no ex-date by 1.5 times its usual gap), read from the steps of the dividend-adjusted against the split-adjusted closes. A name sold on time or dividend is not bought again for 365 days. When the stock book is more than 10 points above the target it is trimmed back pro rata. method net_net or rule_1976 screens one list only; exit oppenheimer is Oppenheimer's 1986 study instead: the November qualifiers bought at the turn of the year, equal-weighted and held 12 months, fully in stocks."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { top_dollar_volume = 6000, asset_class = "stock" }
params = { method = "graham", exit = "graham", bonds = "IEF", stock_low = 0.25, stock_high = 0.75, split_band = 0.10, min_names = 30, net_net_ratio = 0.6667, exit_gain = 0.5, exit_calendar_years = 2, dividend_cut = 0.10, reentry_block_days = 365, max_pe_1976 = 10, always_acceptable_pe_1976 = 7, min_equity_to_assets_1976 = 0.5 }
