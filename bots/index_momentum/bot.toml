description = "Dual momentum across broad equity index funds, with an optional timing overlay and modest leverage. At the first step and each month's last close, rank six index funds listed long before the test (SPY S&P 500, QQQ Nasdaq-100, MDY S&P MidCap 400, IWM Russell 2000, EFA developed ex-US, EEM emerging markets) by their total return over the last months month-ends (relative momentum: Asness, Moskowitz & Pedersen 2013, Value and Momentum Everywhere; Faber 2010, Relative Strength Strategies for Investing) and hold the top ones, each in a 1/top slot only while its return beats T-bills (BIL) over the same months (absolute momentum: Antonacci 2014, Dual Momentum Investing; Moskowitz, Ooi & Pedersen 2012); an empty slot sits in BIL. No fund is chosen by name: a fund is held only when its trailing return leads. overlay none holds the slots at l_max each 1/top; overlay votes scales them every day by l_max times the share of four market-timing conditions at their published parameters that are bullish (buizz_bots.signals: SPY total-return close above its 200-day SMA, Faber 2007; VIX/VIX3M at most 1 from the previous closes; Baa-minus-10-year spread at or below its 6-month mean, Gilchrist & Zakrajsek 2012; growth, at least half of initial claims, industrial production and real retail sales on the expanding side of their 52-week or 12-month averages, Livermore 2016), so exposure moves in quarters of l_max (thirds while the growth data is not yet visible); overlay breadth holds them at l_max while at least 50% of the point-in-time S&P 500 members (ctx.universe_at) are above their own 200-day SMA or SPY is above its own (the breadth_regime rule without smoothing; Zweig 1986, Faber 2007), else all in BIL. Members whose bars are missing drop out of the breadth count. Exposure above 1 is borrowed at the T-bill rate plus the financing spread. Trades at the next open, only when the held set changes or a leg is more than band (0.10) of equity off its target. Sweep grids, fixed before any test: overlay none: top 1, 2, 3 x months 3, 6, 12; overlay votes and overlay breadth each: l_max 1.0, 1.25, 1.5 x top 1, 2 at months 12. Expected against total-return SPY: ahead when one style leads for years (large-cap growth 2016-2021, 2023-2025), behind at sharp leadership reversals (2016 small-cap rebound, 2022) and when absolute momentum steps out just before a V-shaped rebound (2020); the overlays cut exposure in stressed markets and the leverage lifts CAGR only if the overlay raises the Sharpe ratio. All six funds have daily bars from 2003, so the 12-month window is filled before the 10-year period starts."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { symbols = ["SPY", "QQQ", "MDY", "IWM", "EFA", "EEM", "BIL"] }
params = { assets = ["SPY", "QQQ", "MDY", "IWM", "EFA", "EEM"], cash = "BIL", market = "SPY", months = 12, top = 2, overlay = "none", l_max = 1.0, band = 0.10 }

[risk]
max_gross_exposure = 1.5
