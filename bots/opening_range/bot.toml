description = "Opening-range breakout on SPY and QQQ: limit entry beyond the first 30-minute range, stopped at the opposite side, flat before the close."
command = ["uv", "run", "--frozen", "--project", "../../sdk/python", "python", "bot.py"]
timeframe = "1m"
wake = "every:5m"
universe = { symbols = ["SPY", "QQQ"] }
params = { range_minutes = 30, weight = 0.45, limit_buffer_bps = 5, flatten_minutes_before_close = 5 }
