description = "Buffett as an owner of businesses (variant owner, the default): among the owner_universe stocks with the most dollar volume, a stock is requalified on each new 10-K or 10-Q and qualifies when its record_years record shows positive operating income and owner earnings (net income + D&A - all capex) every year, mean ROE of at least min_roe, debt at most max_debt_cover times owner earnings, capex at most max_capex_share of net income plus D&A, pre-tax income of at least $75M in 2014 dollars (CPI-U), a return on capital steadier than the median record's, owner earnings grown by at least min_yield per retained dollar, no 8-K Item 4.02 restatement in five years and officers and directors net sellers of at most max_insider_sale of their stake in a year outside 10b5-1 plans; banks and insurers are left out. It is bought when its owner-earnings yield is at least max(min_yield, 10-year Treasury + yield_spread), best yield x ROE percentile first, at start_weight of equity, up to max_names names, added to by add_weight each time it closes add_on_drop below its average cost and still qualifies, up to cap; idle money sits in BIL and nothing forces a slot to be filled. It is sold in full and at once only when a new filing breaks the qualification or a restatement arrives, when its owner-earnings yield falls below absurd_ratio of the 10-year Treasury, or to swap into a name yielding swap_ratio times the weakest holding's; never because the price fell. Variant systematic is Frazzini-Kabiller-Pedersen's systematic Buffett, long-only: each month end, the holdings stocks with the largest weights in Berkshire's active tilts (MKT, SMB, HML, UMD, BAB, QMJ), equal-weighted, a leg resized only once it drifts more than drift_band of its target"
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { top_dollar_volume = 3000, asset_class = "stock" }
params = { variant = "owner", owner_universe = 1000, record_years = 8, min_roe = 0.15, max_debt_cover = 3.0, max_capex_share = 0.5, min_pretax_2014 = 75000000, max_insider_sale = 0.2, min_yield = 0.06, yield_spread = 0.02, max_names = 12, start_weight = 0.08, add_weight = 0.04, add_on_drop = 0.15, cap = 0.25, absurd_ratio = 0.5, swap_ratio = 2.0, cash_symbol = "BIL", holdings = 50, drift_band = 0.25, loadings = { mkt = 0.27, smb = -0.15, hml = 0.46, umd = -0.05, bab = 0.29, qmj = 0.43 } }
step_timeout = 1800

[risk]
max_gross_exposure = 1.0
