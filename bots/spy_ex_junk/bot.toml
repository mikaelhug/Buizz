description = "SPY without its junk, after Stambaugh, Yu & Yuan (2012, The short of it) and Asness, Frazzini & Pedersen (2019, Quality minus junk): the point-in-time S&P 500, cap-weighted by the last close times the latest XBRL shares outstanding from a 10-K or 10-Q visible at the clock (split-adjusted from its filing date; one line per company when share classes report the same count), minus its junkiest names. Junk score = mean percentile, among members with the measure, of low gross profit / total assets, high accruals ((net income - operating cash flow) / total assets), high log growth of split-adjusted year-end shares outstanding (each from the latest 10-K of two consecutive fiscal years, visible only from their filing) and low 12-1 month total return; a member needs at least one of the three accounting measures to be scored, and one without any (a bank without gross profit, a late or foreign filer) is kept at its cap weight rather than excluded for missing data. The worst exclude fraction of the scored members is dropped and the rest held at their cap weights renormalised to 100%. Rebalanced on the first step and on the last session of each quarter (rebalance = monthly or quarterly) through a drift band: a leg is resized only once it drifts more than drift_band of its target, so cap weights drifting with prices trade nothing. Members leaving the index are sold at the next rebalance. Expected behaviour against total-return SPY: tracking error of 1-3% a year with a small edge (0.5-1.5%/yr in the papers' large-cap results) from avoiding unprofitable, aggressively issuing, accrual-heavy losers, giving back in junk rallies such as 2009 and 2020-21. Sweep grid: exclude = 0.1, 0.2, 0.3; rebalance = monthly, quarterly. Data: S&P 500 membership is reliable from 2011 and XBRL from 2009, so the first honest start is 2012-01 (two 10-K years for share growth and 13 months of prices); design 2012-2017, validation 2018-2025."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { index = "sp500" }
params = { exclude = 0.2, rebalance = "quarterly", drift_band = 0.25 }
benchmark = "SPY"
step_timeout = 300

[risk]
max_gross_exposure = 1.0
