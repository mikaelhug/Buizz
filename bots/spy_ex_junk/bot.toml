description = "SPY without its junk, after Stambaugh, Yu & Yuan (2012, The short of it) and Asness, Frazzini & Pedersen (2019, Quality minus junk): the point-in-time S&P 500, cap-weighted by the last close times the latest XBRL shares outstanding from a 10-K or 10-Q visible at the clock (split-adjusted from its filing date; one line per company when share classes report the same count), minus its junkiest names. Junk score = mean percentile, among members with the measure, of Stambaugh, Yu & Yuan's (2012, 2015) mispricing anomalies that point-in-time EDGAR data supports, each from the latest 10-K (and the one before it for changes): low gross profit / total assets (Novy-Marx 2013), low return on assets (net income / total assets), high accruals ((net income - operating cash flow) / total assets, the cash-flow form), high log growth of split-adjusted year-end shares outstanding (net stock issues, visible only from each 10-K's filing), high asset growth (Cooper, Gulen & Schill 2008), high investment to assets ((change in gross PPE, else net PPE, plus change in inventory) / lagged total assets; Titman, Wei & Xie 2004), high net operating assets ((operating assets - operating liabilities) / lagged total assets, with cash, short-term investments, debt, minority interest, preferred stock and equity taken out; Hirshleifer, Hou, Teoh & Zhang 2004), a high Ohlson (1980) O-score (its published coefficients, with log total assets in place of assets over the GNP deflator, which shifts every member alike and leaves the ranks unchanged) and low 12-1 month total return. Two of the eleven are left out: Campbell, Hilscher & Szilagyi's failure probability and Daniel & Titman's five-year composite equity issuance. A member needs at least one accounting measure to be scored, and one without any (a late or foreign filer) is kept at its cap weight rather than excluded for missing data; a bank without gross profit, current assets or inventory is scored on the measures it has. The worst exclude fraction of the scored members is dropped and the rest held at their cap weights renormalised to 100%. Rebalanced on the first step and on the last session of each quarter (rebalance = monthly or quarterly) through a drift band: a leg is resized only once it drifts more than drift_band of its target, so cap weights drifting with prices trade nothing. Members leaving the index are sold at the next rebalance. Expected behaviour against total-return SPY: tracking error of 1-3% a year with a small edge (0.5-1.5%/yr in the papers' large-cap results; the anomalies' short legs carry most of SYY's mispricing, and the S&P 500's are the least mispriced) from avoiding unprofitable, distressed, aggressively issuing and investing, accrual-heavy losers, giving back in junk rallies such as 2009 and 2020-21. Sweep grid: exclude = 0.1, 0.2, 0.3; rebalance = monthly, quarterly. Data: S&P 500 membership is reliable from 2011 and XBRL from 2009, so the first honest start is 2012-01 (two 10-K years for share growth and 13 months of prices); design 2012-2017, validation 2018-2025."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { index = "sp500" }
params = { exclude = 0.2, rebalance = "quarterly", drift_band = 0.25 }
benchmark = "SPY"
step_timeout = 300

[risk]
max_gross_exposure = 1.0
