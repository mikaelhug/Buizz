description = "Opportunistic insider purchase clusters as a hedged overlay on SPY, in stocks below the largest. The cluster rule is insider_cluster's, from the same code (buizz_bots.insiders, after Cohen, Malloy & Pomorski 2012): officers' and directors' open-market Form 4 purchases visible at the clock by opportunistic insiders only (classified at the start of each calendar year: a P or S in the same company in each of the 3 prior calendar years, and no calendar month with one in all three, which would make them routine), at least 2 distinct remaining insiders with trade dates in the last 30 calendar days for at least $100,000, signalling on the session one of its filings becomes visible. Only the shape and the stocks differ. The book holds SPY at 100% of equity as the market core, buys each new cluster, largest value first, at the next open at overlay / max_names of equity (1/30) for at most 30 names, holds it 63 sessions and sells it at the next open, and shorts the hedge, IWM, for as much as the picks hold, resized whenever a name enters or leaves; SPY is resized only when it drifts more than 5% of equity from 100%. So the book is SPY plus a dollar-neutral insider sleeve, and beating total-return SPY at matched volatility is the sleeve's own edge: market beta is free and earns no credit. Candidates are the top 3000 US stocks by 20-session dollar volume as of each session minus the skip_largest (300) largest, where institutions cannot follow and where Hou, Xue & Zhang (2020) and Cohen, Malloy & Pomorski find most of the anomaly returns; skip_largest 0 keeps them for comparison. Grid fixed before any test: skip_largest 0, 300 on the 10y preset, against insider_cluster's S&P 500 book, which is the same rule with SPY as the implicit hedge. Expected: a sleeve of 30 small-cap names minus IWM carries about 10-15% volatility of its own; the paper's 82 bps a month value-weighted (1986-2007) is pre-decay and pre-cost, so anything above an annual sleeve Sharpe of 0.4 after costs would be notable. Costs bite here: the IWM short pays the flat 2% a year borrow rate on up to 100% of equity, a conservative charge for one of the easiest ETFs to borrow. Form 4 XML history starts mid-2003 and was backfilled S&P 500 members first, so a run before the backfill has reached the smaller companies sees too few of their clusters."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { top_dollar_volume = 3000, asset_class = "stock" }
params = { core = "SPY", hedge = "IWM", skip_largest = 300, overlay = 1.0, max_names = 30, hold_sessions = 63, window_days = 30, min_insiders = 2, min_value = 100000, routine_years = 3 }
benchmark = "SPY"
step_timeout = 300

[risk]
max_gross_exposure = 3.5
