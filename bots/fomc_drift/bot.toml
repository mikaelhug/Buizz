description = "Pre-FOMC announcement drift (Lucca & Moench 2015) as a decay test: 15 minutes before the close of the session before each scheduled FOMC statement day, buy SPY with a market-on-close order; sell at the first step at or after the scheduled statement time (statement_at: 14:00 ET since 2013, 12:30 ET on the 2011-2012 press-conference meetings, 14:15 ET before), which fills at the open of that minute; a position held into a session without a scheduled statement is sold at its first step. Steps every 15 minutes, so 14:15, 14:00, 12:30 and the entry at the close minus 15 minutes (12:45 on half days) are all steps. Unscheduled actions are skipped. Out of the window the book is cash, which earns nothing in the engine, so returns understate a T-bill sleeve by its yield; BIL would add two trades per meeting for a few basis points. Kurov, Wolfe & Gilbert (2021) document that the drift largely disappeared after 2015, so this measures whether it is gone. Minute bars start in 2016, so the bot only runs on 2016 to now: the holdout and the decay period."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1m"
wake = "every:15m"
universe = { symbols = ["SPY"] }
params = { asset = "SPY" }

[risk]
max_gross_exposure = 1.0
