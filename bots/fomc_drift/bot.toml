description = "Pre-FOMC announcement drift (Lucca & Moench 2015) as a decay test, over the paper's window: the 24 hours before each scheduled FOMC statement. At the first step at or after the statement time on the session before (14:00 ET since 2013, 12:30 ET on the 2011-2012 press-conference meetings, 14:15 ET before), buy SPY with a market order, which fills at the open of the next minute; sell at the first step at or after the scheduled statement time (statement_at), which fills at the open of that minute. A session before the statement that closes earlier than that (a half day) buys with a market-on-close order 15 minutes before its close instead. A position held into a session that is neither a scheduled statement day nor the eve of one is sold at its first step. Steps every 15 minutes, so 14:15, 14:00, 12:30 and the half-day 12:45 are all steps. Unscheduled actions are skipped. Out of the window the book is cash, which earns nothing in the engine, so returns understate a T-bill sleeve by its yield; BIL would add two trades per meeting for a few basis points. Kurov, Wolfe & Gilbert (2021) document that the drift largely disappeared after 2015, so this measures whether it is gone. Minute bars start in 2016, so the bot only runs on 2016 to now: the holdout and the decay period."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1m"
wake = "every:15m"
universe = { symbols = ["SPY"] }
params = { asset = "SPY" }

[risk]
max_gross_exposure = 1.0
