description = "Factor momentum across the five iShares MSCI USA factor funds and the market, with the same dual-momentum engine as index_momentum (buizz_bots.rotation). At the first step and each month's last close, rank MTUM (momentum), QUAL (quality), USMV (minimum volatility), VLUE (value), SIZE (size) and SPY by their total return over the last months month-ends and hold the top ones, each in a 1/top slot only while its return beats T-bills (BIL); an empty slot sits in BIL. Factors whose own past year was good tend to keep earning their premium and those whose year was poor tend not to (Gupta & Kelly 2019, Factor Momentum Everywhere; Arnott, Clements, Kalesnik & Linnainmaa 2023, Factor Momentum; Ehsani & Linnainmaa 2022, Factor Momentum and the Momentum Factor), and long-only factor funds keep most of their return as market beta, so the absolute-momentum hurdle doubles as a trend filter (Antonacci 2014). SPY is one of the six so the book can hold the market when no factor leads it; no fund is chosen by name. overlay none holds the slots at l_max each 1/top; overlay votes, breadth or ensemble scale them daily as in index_momentum (buizz_bots.signals.overlay_share). Trades at the next open, only when the held set changes or a leg is more than band (0.10) of equity off its target. The funds listed in 2011 (USMV) and 2013 (MTUM, QUAL, VLUE, SIZE); a fund without months of month-end closes visible at the clock is not ranked until it has them, so VLUE and SIZE join the ranking later where the store lacks their pre-2016 history. Sweep grid, fixed before any test: top 1, 2 x months 6, 12 with overlay none (4 variants). Expected against total-return SPY: close to SPY in long broad bull markets, ahead when one factor leads for a year or more (MTUM and QUAL 2016-2017 and 2020, USMV in 2022's sell-off before absolute momentum moves to T-bills), behind at factor reversals (value in late 2020) when the book still holds last year's leader."
command = ["uv", "run", "--frozen", "--project", "..", "python", "bot.py"]
timeframe = "1d"
wake = "bar"
universe = { symbols = ["MTUM", "QUAL", "USMV", "VLUE", "SIZE", "SPY", "BIL"] }
params = { assets = ["MTUM", "QUAL", "USMV", "VLUE", "SIZE", "SPY"], cash = "BIL", market = "SPY", months = 12, top = 2, overlay = "none", l_max = 1.0, band = 0.10 }

[risk]
max_gross_exposure = 1.5
